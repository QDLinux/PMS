server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/personal_manager?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: cGVyc29uYWwtbWFuYWdlci1qd3Qtc2VjcmV0LXNlZWRfMjAyNg==
    expiration-ms: 86400000  # JWT有效时间
  ai:
    enabled: true
    # OpenAI-compatible base url (e.g. https://api.openai.com or https://api.deepseek.com)
    base-url: https://api.deepseek.com
    # Fill your provider API key here, or inject with env var AI_API_KEY
    api-key: your provider API key  # or${AI_API_KEY:}
    model: deepseek-chat
    temperature: 0.5
    max-tokens: 2000
    timeout-ms: 30000
    log-dir: logs/ai-chat
    system-prompt: 你是一个个人财务与事务管理助手。你可以通过工具查询用户的账单记录、月度汇总、待办计划和储蓄目标。当用户询问具体数据（历史账单、某月收支、计划进度、目标状态等）时，务必先调用工具获取真实数据，再基于数据给出清晰、可执行、简洁的中文建议。
